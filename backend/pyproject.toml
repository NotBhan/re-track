[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrack-ai"
dynamic = ["version"]
description = "RE:Track (RefinedEngine Track) — Persistent memory, deterministic AST call graphs, and context engine for AI-assisted development."
readme = "README.md"
requires-python = ">=3.11, <3.14"
license = { text = "MIT" }
authors = [
    { name = "RE:Track Developers" },
]
keywords = ["mcp", "ai-agents", "ast-call-graph", "context-engine", "code-intelligence", "cognee"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "cognee>=0.1.38",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "typer>=0.12.0",
    "rich>=13.9.0",
    "markdown>=3.7",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "mcp>=1.0.0",
]

[project.scripts]
retrack = "app.cli.main:app"
retrack-mcp = "app.mcp.server:main"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
    "/app",
    "/requirements.txt",
    "/mcp_server.py",
    "/retrack.py",
    "/README.md",
]
