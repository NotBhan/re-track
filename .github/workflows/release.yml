name: RE:Track Release Publication

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag version to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_and_publish_release:
    name: Validate, Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend environment
        run: |
          cd backend
          uv sync --frozen || uv sync

      - name: Validate Release Tag against Authoritative Version
        run: |
          TAG_NAME="${{ github.ref_name || inputs.version_tag }}"
          CLEAN_TAG="${TAG_NAME#v}"
          RUNTIME_VERSION=$(cd backend && uv run python -c "import app; print(app.__version__)")
          echo "Tag Version: $CLEAN_TAG"
          echo "Runtime Version: $RUNTIME_VERSION"
          if [ "$CLEAN_TAG" != "$RUNTIME_VERSION" ]; then
            echo "ERROR: Git tag '$TAG_NAME' (parsed as '$CLEAN_TAG') does not match authoritative backend version '$RUNTIME_VERSION'!"
            exit 1
          fi

      - name: Verify Single-Source Version Authority
        run: |
          cd backend
          uv run pytest tests/test_version_authority.py -v

      - name: Verify Benchmark Regression Gate
        run: |
          cd backend
          uv run pytest tests/test_benchmark_baseline_contract.py -v

      - name: Build Wheel and Source Distribution
        run: |
          cd backend
          uv build --out-dir dist

      - name: Execute Clean-Install Validation Outside Repository
        run: |
          cd backend
          uv run pytest tests/test_packaging_validation.py -v

      - name: Generate SHA-256 Checksums
        id: checksums
        run: |
          cd backend/dist
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
          echo "Generated Checksums:"
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version_tag }}
          name: "RE:Track v${{ github.ref_name || inputs.version_tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            backend/dist/*.whl
            backend/dist/*.tar.gz
            backend/dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
